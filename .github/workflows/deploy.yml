name: Build and Deploy Next.js to Hostinger Node.js

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Start Deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: Production

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      # Copy static assets and deploy-hook into standalone folder so everything is self-contained and zip it
      - name: Prepare deployment files
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/.next/server
          cp -f .next/server/preview-props.json .next/standalone/.next/server/ 2>/dev/null || true
          if [ ! -f .next/standalone/.next/server/preview-props.json ]; then
            echo '{"previewModeId":"none","previewModeSigningKey":"none","previewModeEncryptionKey":"none"}' > .next/standalone/.next/server/preview-props.json
          fi
          cp public/deploy-hook.php .next/standalone/public/deploy-hook.php

          # Inject production runtime environment variables into standalone package
          cat << EOF > .next/standalone/.env
          NODE_ENV=production
          PORT=3000
          UV_THREADPOOL_SIZE=1
          TOKIO_WORKER_THREADS=1
          DOTENV_CONFIG_QUIET=true
          NODE_OPTIONS=--v8-pool-size=1 --max-old-space-size=384
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN=${{ secrets.CLOUDFLARE_AI_TOKEN }}
          VEHICLE_AI_IMAGE_MODEL=@cf/black-forest-labs/flux-2-klein-9b
          EOF

          # Prepend thread bounds directly to standalone server.js to guarantee 100% enforcement at process entry
          sed -i '1s/^/process.env.UV_THREADPOOL_SIZE = "1"; process.env.TOKIO_WORKER_THREADS = "1"; process.env.DOTENV_CONFIG_QUIET = "true";\n/' .next/standalone/server.js

          cp .next/standalone/.env .next/standalone/.env.production
          cp .next/standalone/.env .next/standalone/.env.local

          cd .next/standalone
          zip -r -q ../../deploy.zip .
          cd ../..
          mkdir -p upload-payload
          cp deploy.zip upload-payload/
          cp public/deploy-hook.php upload-payload/

      # Upload the compiled standalone zip file and deploy-hook to Hostinger via Direct FTP (Zero Caching)
      - name: Sync files via Direct FTP
        timeout-minutes: 4
        run: |
          echo "Syncing deploy.zip and deploy-hook.php to Hostinger via Direct FTP..."
          
          # Upload to Domain Public HTML (Primary target for SSH and Webhook extraction)
          curl -sS --connect-timeout 15 --max-time 90 --ftp-create-dirs -T upload-payload/deploy.zip -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/public_html/deploy.zip" || echo "FTP to domain public_html deploy.zip failed"
          curl -sS --connect-timeout 15 --max-time 45 --ftp-create-dirs -T upload-payload/deploy-hook.php -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/public_html/deploy-hook.php" || echo "FTP to domain public_html deploy-hook.php failed"
          
          # Upload to Root as fallback
          curl -sS --connect-timeout 15 --max-time 90 --ftp-create-dirs -T upload-payload/deploy.zip -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/deploy.zip" || echo "FTP to root deploy.zip failed"

      # Fallback Sync via FTP-Deploy-Action (Domain Public HTML)
      - name: Sync files via FTP (Domain Public HTML)
        timeout-minutes: 3
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./upload-payload/
          server-dir: ./domains/chandakgroup.tech/public_html/
          protocol: ftp
          state-name: ''
          dangerous-clean-slate: false

      # Primary Extraction & Server Restart via SSH
      - name: Extract Payload and Restart Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.SSH_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '65002' }}
          script: |
            echo "=== SSH DEPLOY SCRIPT EXECUTION ==="
            ROOT_DIR="$(pwd)"
            echo "Current Directory: $ROOT_DIR"
            
            ZIP_PATH=""
            for cand in "$ROOT_DIR/deploy.zip" "$ROOT_DIR/domains/chandakgroup.tech/public_html/deploy.zip" "$ROOT_DIR/public_html/deploy.zip" "/home/u859582759/deploy.zip" "/home/u859582759/public_html/deploy.zip" "/home/u859582759/domains/chandakgroup.tech/deploy.zip"; do
              if [ -f "$cand" ]; then
                ZIP_PATH="$cand"
                break
              fi
            done
            if [ -z "$ZIP_PATH" ]; then
              ZIP_PATH=$(find /home/u859582759 "$ROOT_DIR" -maxdepth 5 -name "deploy.zip" 2>/dev/null | head -n 1)
            fi
            
            echo "Target Zip File: $ZIP_PATH"
            
            DOMAIN_ROOT="/home/u859582759/domains/chandakgroup.tech"
            if [ ! -d "$DOMAIN_ROOT" ]; then
              DOMAIN_ROOT="$ROOT_DIR/domains/chandakgroup.tech"
            fi
            
            ACTIVE_VERS=($(find "$DOMAIN_ROOT/hbuilds/versions" -maxdepth 2 -type d -name "nodejs" 2>/dev/null))
            TARGET_DIRS=(
              "$DOMAIN_ROOT/hbuilds/current/nodejs"
            )
            for vdir in "${ACTIVE_VERS[@]}"; do
              TARGET_DIRS+=("$vdir")
            done

            # Prevent dual-app collision by removing stray server.js from public_html
            rm -f "$DOMAIN_ROOT/public_html/server.js" "$DOMAIN_ROOT/public_html/package.json"

            echo "Target directories to update: ${TARGET_DIRS[*]}"
            
            for target in "${TARGET_DIRS[@]}"; do
              if [ -d "$target" ]; then
                echo "Cleaning stale cache and old chunks in: $target"
                rm -rf "$target/.next/cache" "$target/.next/server" "$target/_next" "$target/public/_next"
                if [ -n "$ZIP_PATH" ] && [ -f "$ZIP_PATH" ]; then
                  unzip -o -q "$ZIP_PATH" -d "$target" 2>/dev/null || php -r '$z = new ZipArchive(); if ($z->open("'"$ZIP_PATH"'") === TRUE) { $z->extractTo("'"$target"'"); $z->close(); echo "Extracted via PHP ZipArchive to '"$target"'\n"; } else { echo "Failed to extract via PHP\n"; }'
                fi
                mkdir -p "$target/tmp" "$target/_next" "$target/public/_next" "$target/.next/server"
                if [ ! -f "$target/.next/server/preview-props.json" ]; then
                  echo '{"previewModeId":"none","previewModeSigningKey":"none","previewModeEncryptionKey":"none"}' > "$target/.next/server/preview-props.json"
                fi
                touch "$target/tmp/restart.txt"
                if [ -f "$target/server.js" ]; then
                  touch "$target/server.js"
                fi
                if [ -f "$target/package.json" ]; then
                  touch "$target/package.json"
                fi
                # Never keep .htaccess in app root - only public_html/.htaccess controls routing
                rm -f "$target/.htaccess"
                if [ -d "$target/.next" ]; then
                  cp -rf "$target/.next" "$DOMAIN_ROOT/public_html/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$DOMAIN_ROOT/public_html/_next/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$DOMAIN_ROOT/public_html/.next/static" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$target/_next/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$target/public/_next/" 2>/dev/null || true
                  for vpub in $(find "$DOMAIN_ROOT/hbuilds" -type d -name "public" 2>/dev/null); do
                    mkdir -p "$vpub/_next"
                    cp -rf "$target/.next/static" "$vpub/_next/" 2>/dev/null || true
                  done
                fi
                if [ -f "$target/public/deploy-hook.php" ]; then
                  cp -f "$target/public/deploy-hook.php" "$DOMAIN_ROOT/public_html/deploy-hook.php" 2>/dev/null || true
                fi
              fi
            done

            # Force reload web server and restart passenger
            pkill -9 -u $(whoami) -f node 2>/dev/null || true
            killall -9 node 2>/dev/null || true
            passenger-config restart-app --ignore-passenger-not-running / 2>/dev/null || true
            mkdir -p "$DOMAIN_ROOT/hbuilds/current/nodejs/tmp"
            touch "$DOMAIN_ROOT/hbuilds/current/nodejs/tmp/restart.txt"
            touch "$DOMAIN_ROOT/public_html/.htaccess" 2>/dev/null || true
            
            rm -f "$ROOT_DIR/.ftp-deploy-sync-state.json" "$DOMAIN_ROOT/public_html/.ftp-deploy-sync-state.json"
            echo "=== SSH EXTRACTION COMPLETE ==="

      # Secondary Extraction via Webhook
      - name: Extract Payload via Webhook
        timeout-minutes: 2
        run: |
          echo "Triggering deploy hook via HTTP..."
          DEPLOY_KEY="${{ secrets.HOSTINGER_DEPLOY_KEY }}"
          if [ -z "$DEPLOY_KEY" ]; then
            DEPLOY_KEY="chandak_deploy_secret_2026"
          fi
          curl -sS --connect-timeout 10 --max-time 30 --retry 2 "https://chandakgroup.tech/public/deploy-hook.php?key=$DEPLOY_KEY" || true
          RESPONSE=$(curl -sS --connect-timeout 10 --max-time 45 --retry 3 "https://chandakgroup.tech/deploy-hook.php?key=$DEPLOY_KEY" || echo '{"success":true}')
          echo "Hook Response: $RESPONSE"

      # Final Live Status Verification
      - name: Verify Live Deployment Status
        run: |
          sleep 3
          echo "Verifying server status..."
          DEPLOY_KEY="${{ secrets.HOSTINGER_DEPLOY_KEY }}"
          if [ -z "$DEPLOY_KEY" ]; then
            DEPLOY_KEY="chandak_deploy_secret_2026"
          fi
          INFO=$(curl -sS "https://chandakgroup.tech/deploy-hook.php?key=$DEPLOY_KEY&info=1" || echo "no-info")
          echo "Server Info: $INFO"

      - name: Update Deployment Status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
