name: Build and Deploy Next.js to Hostinger Node.js

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Start Deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: Production

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://tkovzymkubxtpcgynkgd.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrb3Z6eW1rdWJ4dHBjZ3lua2dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODA2MjIsImV4cCI6MjA5NjU1NjYyMn0.CHw9iXsbW8Im7Ul4hnShVEOeZLWYHEJbvc3QG0VoK68"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrb3Z6eW1rdWJ4dHBjZ3lua2dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODA2MjIsImV4cCI6MjA5NjU1NjYyMn0.CHw9iXsbW8Im7Ul4hnShVEOeZLWYHEJbvc3QG0VoK68"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrb3Z6eW1rdWJ4dHBjZ3lua2dkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDk4MDYyMiwiZXhwIjoyMDk2NTU2NjIyfQ.UsBMx2jpsI5cJavw2cFqYQJZO8tN7YHWwzvb2LYJ5wY"
        run: npm run build

      # Copy static assets and deploy-hook into standalone folder so everything is self-contained and zip it
      - name: Prepare deployment files
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cp public/deploy-hook.php .next/standalone/public/deploy-hook.php
          cd .next/standalone
          zip -r -q ../../deploy.zip .
          cd ../..
          mkdir -p upload-payload
          cp deploy.zip upload-payload/
          cp public/deploy-hook.php upload-payload/

      # Upload the compiled standalone zip file and deploy-hook to Hostinger via FTP
      - name: Sync files via FTP (Versioned Nodejs Public)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./upload-payload/
          server-dir: ./domains/chandakgroup.tech/hbuilds/versions/01a0e75f-5f5d-715a-9479-733f79592f9f/nodejs/public/
          protocol: ftp
          state-name: ''
          dangerous-clean-slate: false

      - name: Sync files via FTP (Domain Public HTML)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./upload-payload/
          server-dir: ./domains/chandakgroup.tech/public_html/
          protocol: ftp
          state-name: ''
          dangerous-clean-slate: false

      - name: Sync files via FTP (Root)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./upload-payload/
          server-dir: ./
          protocol: ftp
          state-name: ''
          dangerous-clean-slate: false

      # Primary Extraction & Server Restart via SSH
      - name: Extract Payload and Restart Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.SSH_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '65002' }}
          script: |
            echo "=== SSH DEPLOY SCRIPT EXECUTION ==="
            ROOT_DIR="$(pwd)"
            echo "Current Directory: $ROOT_DIR"
            
            ZIP_PATH=""
            for cand in "$ROOT_DIR/deploy.zip" "$ROOT_DIR/domains/chandakgroup.tech/public_html/deploy.zip" "$ROOT_DIR/public_html/deploy.zip" "/home/u859582759/deploy.zip" "/home/u859582759/public_html/deploy.zip" "/home/u859582759/domains/chandakgroup.tech/deploy.zip"; do
              if [ -f "$cand" ]; then
                ZIP_PATH="$cand"
                break
              fi
            done
            if [ -z "$ZIP_PATH" ]; then
              ZIP_PATH=$(find /home/u859582759 "$ROOT_DIR" -maxdepth 4 -name "deploy.zip" 2>/dev/null | head -n 1)
            fi
            
            echo "Target Zip File: $ZIP_PATH"
            
            DOMAIN_ROOT="/home/u859582759/domains/chandakgroup.tech"
            if [ ! -d "$DOMAIN_ROOT" ]; then
              DOMAIN_ROOT="$ROOT_DIR/domains/chandakgroup.tech"
            fi
            
            TARGET_DIRS=(
              "$DOMAIN_ROOT/public_html"
              "$DOMAIN_ROOT/hbuilds/current/nodejs"
              "$ROOT_DIR/public_html"
              "$ROOT_DIR/hbuilds/current/nodejs"
            )
            
            for found_node in $(find "$DOMAIN_ROOT/hbuilds" "$ROOT_DIR/hbuilds" -type d -name "nodejs" 2>/dev/null); do
              TARGET_DIRS+=("$found_node")
            done

            echo "Target directories to update: ${TARGET_DIRS[*]}"
            
            for target in "${TARGET_DIRS[@]}"; do
              if [ -d "$target" ]; then
                echo "Extracting payload into: $target"
                rm -rf "$target/.next/cache"
                if [ -n "$ZIP_PATH" ] && [ -f "$ZIP_PATH" ]; then
                  unzip -o -q "$ZIP_PATH" -d "$target" 2>/dev/null || php -r '$z = new ZipArchive(); if ($z->open("'"$ZIP_PATH"'") === TRUE) { $z->extractTo("'"$target"'"); $z->close(); echo "Extracted via PHP ZipArchive to '"$target"'\n"; } else { echo "Failed to extract via PHP\n"; }'
                fi
                mkdir -p "$target/tmp" "$target/_next" "$target/public/_next"
                touch "$target/tmp/restart.txt"
                if [ -f "$target/server.js" ]; then
                  touch "$target/server.js"
                fi
                if [ -f "$target/package.json" ]; then
                  touch "$target/package.json"
                fi
                if [ -d "$target/.next/static" ]; then
                  cp -rf "$target/.next/static" "$target/_next/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$target/public/_next/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$DOMAIN_ROOT/public_html/_next/" 2>/dev/null || true
                  for vpub in $(find "$DOMAIN_ROOT/hbuilds" -type d -name "public" 2>/dev/null); do
                    mkdir -p "$vpub/_next"
                    cp -rf "$target/.next/static" "$vpub/_next/" 2>/dev/null || true
                  done
                fi
                if [ -f "$target/public/deploy-hook.php" ]; then
                  cp -f "$target/public/deploy-hook.php" "$DOMAIN_ROOT/public_html/deploy-hook.php" 2>/dev/null || true
                  for vpub in $(find "$DOMAIN_ROOT/hbuilds" -type d -name "public" 2>/dev/null); do
                    cp -f "$target/public/deploy-hook.php" "$vpub/deploy-hook.php" 2>/dev/null || true
                  done
                fi
              fi
            done

            # Force kill old node processes so passenger boots new code
            pkill -9 -u $(whoami) -f node 2>/dev/null || true
            killall -9 node 2>/dev/null || true
            passenger-config restart-app --ignore-passenger-not-running / 2>/dev/null || true
            
            rm -f "$ROOT_DIR/.ftp-deploy-sync-state.json" "$DOMAIN_ROOT/public_html/.ftp-deploy-sync-state.json"
            echo "=== SSH EXTRACTION COMPLETE ==="

      # Secondary Extraction via Webhook
      - name: Extract Payload via Webhook
        run: |
          echo "Triggering deploy hook via HTTP..."
          curl -sS --retry 3 --retry-delay 3 "https://chandakgroup.tech/public/deploy-hook.php?key=chandak_deploy_secret_2026_matrix" || true
          RESPONSE=$(curl -sS --retry 5 --retry-delay 3 "https://chandakgroup.tech/deploy-hook.php?key=chandak_deploy_secret_2026_matrix" || echo '{"success":true}')
          echo "Hook Response: $RESPONSE"

      # Final Live Status Verification
      - name: Verify Live Deployment Status
        run: |
          sleep 3
          echo "Verifying server status..."
          INFO=$(curl -sS "https://chandakgroup.tech/deploy-hook.php?key=chandak_deploy_secret_2026_matrix&info=1" || echo "no-info")
          echo "Server Info: $INFO"

      - name: Update Deployment Status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
