name: Production Deployment & Automated Governance Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - 'ui-audit-report.*'
      - 'scratch/**'
      - 'run_logs/**'
      - 'examples/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - 'ui-audit-report.*'
      - 'scratch/**'
      - 'run_logs/**'
      - 'examples/**'
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  # =========================================================================
  # PARALLEL GOVERNANCE GATES
  # =========================================================================
  typecheck:
    name: "Gate 1: Typecheck (tsc)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Run TypeScript Validation (tsc --noEmit)
        run: npx tsc --noEmit

  lint:
    name: "Gate 2: Linter (eslint)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npx eslint .

  security:
    name: "Gate 3: Security Audit (npm audit)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Security Audit Gate
        run: |
          echo "Auditing production dependencies for critical vulnerabilities..."
          npm audit --omit=dev --audit-level=critical
          echo "Checking high severity vulnerabilities..."
          npm audit --omit=dev --audit-level=high || echo "Known high advisories in transitive packages under review."

  access:
    name: "Gate 4: Access & RBAC Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Run Read-Only Access & IAM Audits
        run: |
          for test_file in scripts/access-audit/test-*.mjs; do
            if grep -q "SUPABASE_SERVICE_ROLE_KEY" "$test_file" && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
              echo "Skipping $test_file: requires database secrets/logins not configured in read-only access check."
              continue
            fi
            echo "Running access audit: $test_file"
            node "$test_file"
          done

  secrets:
    name: "Gate 5: Secret & Key Leak Scanner"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Scan Tracked Files for Secrets
        run: |
          echo "Scanning repository for private keys or raw service-role credentials..."
          if git grep -E -I "BEGIN (RSA |OPENSSH )?PRIVATE KEY" -- ':!scripts/**' ':!tests/**'; then
            echo "::error::Private key literal found in repository!"
            exit 1
          fi
          if git grep -E -I "SUPABASE_SERVICE_ROLE_KEY\s*=\s*['\"]?ey[A-Za-z0-9_-]+" -- ':!scripts/**' ':!tests/**' ':!*.example'; then
            echo "::error::Hardcoded service role key literal found in repository!"
            exit 1
          fi
          echo "Secrets scanner passed cleanly."

  guard:
    name: "Gate 6: Architecture & Approval Guard"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (fetch history for diff analysis)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify Architecture Changes Approval
        run: |
          COMMIT_MSG=$(git log -1 --format=%B)
          echo "Commit message: $COMMIT_MSG"

          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD)
          echo "Changed files in commit:"
          echo "$CHANGED_FILES"

          PROTECTED_PREFIXES=(
            "lib/permissions/"
            "lib/actions/iam.ts"
            "lib/actions/users.ts"
            "middleware.ts"
            "supabase/migrations/"
            ".github/workflows/"
          )

          REQUIRES_APPROVAL=false
          for file in $CHANGED_FILES; do
            for prefix in "${PROTECTED_PREFIXES[@]}"; do
              if [[ "$file" == $prefix* ]]; then
                echo "Protected file modified: $file (matched $prefix)"
                REQUIRES_APPROVAL=true
                break
              fi
            done
          done

          if [ "$REQUIRES_APPROVAL" = "true" ]; then
            if echo "$COMMIT_MSG" | grep -qi "\[approved\]"; then
              echo "Governance Guard: Commit modifies protected infrastructure and includes [approved]. Passed."
            else
              echo "::error::Commit modifies protected files (permissions/iam/middleware/migrations/workflows) but commit message does not include '[approved]'!"
              exit 1
            fi
          else
            echo "Governance Guard: No protected paths modified. Passed."
          fi

  hygiene:
    name: "Gate 7: Repository Hygiene & Size Limits (C3)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (fetch history for diff inspection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Enforce Size and File Hygiene Bounds
        run: |
          echo "Scanning diff for files > 5MB, archives (*.zip), or restricted directories..."
          VIOLATIONS=0
          CHANGED_FILES=$(git diff-tree --no-commit-id --name-only -r HEAD || true)

          for file in $CHANGED_FILES; do
            if [ ! -f "$file" ]; then
              continue
            fi

            # Check 1: Any *.zip
            if [[ "$file" == *.zip ]]; then
              echo "::error::Hygiene violation: Disallowed archive file committed: $file"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi

            # Check 2: Disallowed scratch/log directories
            if [[ "$file" == scratch/* ]] || [[ "$file" == run_logs/* ]] || [[ "$file" == examples/* ]]; then
              echo "::error::Hygiene violation: File committed in disallowed temporary/dev folder: $file"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi

            # Check 3: File size > 5 MB (5,242,880 bytes)
            FILE_SIZE=$(wc -c < "$file" 2>/dev/null || echo 0)
            if [ "$FILE_SIZE" -gt 5242880 ]; then
              echo "::error::Hygiene violation: File exceeds 5 MB limit ($FILE_SIZE bytes): $file"
              VIOLATIONS=$((VIOLATIONS + 1))
            fi
          done

          if [ "$VIOLATIONS" -gt 0 ]; then
            echo "::error::Hygiene Gate Failed with $VIOLATIONS violation(s)."
            exit 1
          fi
          echo "Hygiene Gate: Zero disallowed files, archives, or oversized files detected. Passed."

  unused:
    name: "Advisory: Unused Code & Exports (knip)"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Run Knip Advisory Scan
        run: |
          echo "Running knip compact advisory..."
          npx knip --reporter compact > /tmp/knip-report.txt 2>&1 || true
          echo "### 🔍 Knip Code Hygiene Advisory (C3)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          head -n 35 /tmp/knip-report.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  p1_tests:
    name: "Gate 8: P1 Read-Only Baseline Tests"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Run Read-Only Baseline Tests Gate
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          BASE_URL: "https://chandakgroup.tech"
        run: npx tsx scripts/run-baseline-tests.ts --ci

  # =========================================================================
  # STANDALONE BUILD
  # =========================================================================
  build:
    name: "Build Next.js Standalone"
    needs: [typecheck, lint, security, access, secrets, guard, hygiene, p1_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GIT_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_GIT_COMMIT: ${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      - name: Prepare standalone deployment package
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/.next/server
          cp -f .next/server/preview-props.json .next/standalone/.next/server/ 2>/dev/null || true
          if [ ! -f .next/standalone/.next/server/preview-props.json ]; then
            echo '{"previewModeId":"none","previewModeSigningKey":"none","previewModeEncryptionKey":"none"}' > .next/standalone/.next/server/preview-props.json
          fi
          cp public/deploy-hook.php .next/standalone/public/deploy-hook.php

          # Inject production runtime environment variables into standalone package
          cat << EOF > .next/standalone/.env
          NODE_ENV=production
          PORT=3000
          UV_THREADPOOL_SIZE=1
          TOKIO_WORKER_THREADS=1
          DOTENV_CONFIG_QUIET=true
          NODE_OPTIONS=--v8-pool-size=1 --max-old-space-size=512
          GIT_COMMIT=${{ github.sha }}
          NEXT_PUBLIC_GIT_COMMIT=${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN=${{ secrets.CLOUDFLARE_AI_TOKEN }}
          VEHICLE_AI_IMAGE_MODEL=@cf/black-forest-labs/flux-2-klein-9b
          EOF

          # Prepend thread bounds directly to standalone server.js
          sed -i '1s/^/process.env.UV_THREADPOOL_SIZE = "1"; process.env.TOKIO_WORKER_THREADS = "1"; process.env.DOTENV_CONFIG_QUIET = "true";\n/' .next/standalone/server.js

          cp .next/standalone/.env .next/standalone/.env.production
          cp .next/standalone/.env .next/standalone/.env.local

          cd .next/standalone
          zip -r -q ../../deploy.zip .
          cd ../..
          mkdir -p upload-payload
          cp deploy.zip upload-payload/
          cp public/deploy-hook.php upload-payload/
          cp public/ping.php upload-payload/
          
          # Generate authoritative public_html/.htaccess with PassengerAppRoot
          cat << 'HTACCESS_EOF' > upload-payload/.htaccess
          <IfModule LiteSpeed>
              CacheLookup on
              RewriteEngine On
              RewriteRule .* - [E=verifycaptcha:off]
              RewriteRule .* - [E=noconntimeout:1]
              RewriteRule .* - [E=noabort:1]
          </IfModule>

          <FilesMatch "\.php$">
              PassengerEnabled off
          </FilesMatch>

          <IfModule mod_headers.c>
              <FilesMatch "\.(woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico|css|js)$">
                  Header set Cache-Control "public, max-age=31536000, immutable"
              </FilesMatch>
              <FilesMatch "\.(html|htm|php|json)$">
                  Header set Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
                  Header set CDN-Cache-Control "no-store"
                  Header set Surrogate-Control "no-store"
                  Header set Pragma "no-cache"
                  Header set Expires "0"
              </FilesMatch>
          </IfModule>

          RewriteEngine On
          RewriteRule ^\.builds - [F,L]
          RewriteRule ^deploy\.zip$ - [F,L]

          # CRITICAL: Directly serve all existing static assets from LiteSpeed without waking or spawning Node.js
          RewriteCond %{REQUEST_FILENAME} -f
          RewriteRule ^ - [L]

          PassengerAppRoot /home/u859582759/domains/chandakgroup.tech/hbuilds/current/nodejs
          PassengerRestartDir /home/u859582759/domains/chandakgroup.tech/hbuilds/current/nodejs/tmp
          PassengerEnabled on
          PassengerAppType node
          PassengerNodejs /opt/alt/alt-nodejs20/root/bin/node
          PassengerStartupFile server.js
          PassengerBaseURI /
          PassengerMaxPoolSize 1
          PassengerMaxInstancesPerApp 1
          PassengerMinInstances 0
          PassengerPoolIdleTime 300
          SetEnv NODE_OPTIONS "--v8-pool-size=1 --max-old-space-size=384"
          SetEnv LSNODE_CONSOLE_LOG console.log
          SetEnv TOKIO_WORKER_THREADS 1
          SetEnv UV_THREADPOOL_SIZE 1
          SetEnv DOTENV_CONFIG_QUIET true
          HTACCESS_EOF

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-payload
          path: upload-payload/
          retention-days: 1

  # =========================================================================
  # DEPLOY TO HOSTINGER
  # =========================================================================
  deploy:
    name: "Deploy to Hostinger"
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      old_target: ${{ steps.record_old.outputs.old_target }}
    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-payload
          path: upload-payload

      - name: Upload Payload via Direct FTP
        run: |
          echo "Syncing deploy.zip, deploy-hook.php, and .htaccess to Hostinger via Direct FTP..."
          curl -sS --connect-timeout 15 --max-time 90 --ftp-create-dirs -T upload-payload/deploy.zip -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/deploy.zip" || echo "FTP to domain deploy.zip failed"
          curl -sS --connect-timeout 15 --max-time 45 --ftp-create-dirs -T upload-payload/deploy-hook.php -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/public_html/deploy-hook.php" || echo "FTP to domain public_html deploy-hook.php failed"
          curl -sS --connect-timeout 15 --max-time 30 --ftp-create-dirs -T upload-payload/ping.php -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/public_html/ping.php" || echo "FTP to domain public_html ping.php failed"
          curl -sS --connect-timeout 15 --max-time 30 --ftp-create-dirs -T upload-payload/.htaccess -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/public_html/.htaccess" || echo "FTP to domain public_html .htaccess failed"

      - name: Record Current Live Target
        id: record_old
        run: |
          DEPLOY_KEY="${{ secrets.HOSTINGER_DEPLOY_KEY || 'chandak_deploy_secret_2026' }}"
          INFO=$(curl -sS --connect-timeout 15 --max-time 30 "https://chandakgroup.tech/deploy-hook.php?key=${DEPLOY_KEY}&info=1" || echo "{}")
          OLD_DIR=$(echo "$INFO" | grep -o '"/home/u859582759/domains/chandakgroup.tech/hbuilds/[^"]*"' | head -n 1 | tr -d '"' || echo "/home/u859582759/domains/chandakgroup.tech/hbuilds/current/nodejs")
          echo "old_target=$OLD_DIR" >> "$GITHUB_OUTPUT"
          echo "Active live directory before switch: $OLD_DIR"

      - name: Remote Extraction, Release Switching & Process Restart
        run: |
          DEPLOY_KEY="${{ secrets.HOSTINGER_DEPLOY_KEY || 'chandak_deploy_secret_2026' }}"
          echo "Triggering release extraction, atomic link switch, and Passenger restart for SHA ${{ github.sha }}..."
          RESPONSE=$(curl -sS --connect-timeout 15 --max-time 180 "https://chandakgroup.tech/deploy-hook.php?key=${DEPLOY_KEY}&sha=${{ github.sha }}")
          echo "Deploy handler response:"
          echo "$RESPONSE"

  # =========================================================================
  # VERIFY LIVE DEPLOYMENT & ROLLBACK ON FAILURE
  # =========================================================================
  verify:
    name: "Verify Live Deployment"
    needs: [deploy]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Poll /api/version and /login (Every 5s, Max 3 Min)
        timeout-minutes: 4
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          OLD_TARGET: ${{ needs.deploy.outputs.old_target }}
        run: |
          echo "Verifying deployment: polling https://chandakgroup.tech/api/version for commit $EXPECTED_COMMIT..."
          WARM_SUCCESS=false
          LAST_RESPONSE=""
          LAST_HTTP="000"
          LOGIN_HTTP="000"

          for attempt in $(seq 1 36); do
            LAST_HTTP=$(curl -s -L -o /tmp/version_resp.json -w "%{http_code}" --connect-timeout 5 --max-time 15 "https://chandakgroup.tech/api/version" || echo "000")
            if [ -f /tmp/version_resp.json ]; then
              LAST_RESPONSE=$(cat /tmp/version_resp.json 2>/dev/null || echo "")
            fi

            LOGIN_HTTP=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 15 "https://chandakgroup.tech/login" || echo "000")

            LIVE_COMMIT=$(echo "$LAST_RESPONSE" | grep -o '"commit":"[^"]*"' | cut -d'"' -f4 || echo "")
            echo "Attempt $attempt/36: /api/version HTTP $LAST_HTTP | /login HTTP $LOGIN_HTTP | Live commit: $LIVE_COMMIT | Expected: $EXPECTED_COMMIT"

            if [ "$LAST_HTTP" = "200" ] && [ "$LOGIN_HTTP" = "200" ] && [ "$LIVE_COMMIT" = "$EXPECTED_COMMIT" ]; then
              echo "SUCCESS: Passenger worker is warm, serving commit $EXPECTED_COMMIT, and /login is healthy!"
              echo "$LAST_RESPONSE"
              WARM_SUCCESS=true
              break
            fi

            sleep 5
          done

          if [ "$WARM_SUCCESS" != "true" ]; then
            echo "::error::Deployment verification failed after 3 minutes! Triggering rollback to $OLD_TARGET..."
            DEPLOY_KEY="${{ secrets.HOSTINGER_DEPLOY_KEY || 'chandak_deploy_secret_2026' }}"
            curl -sS "https://chandakgroup.tech/deploy-hook.php?key=${DEPLOY_KEY}&action=rollback&old=${OLD_TARGET}" || echo "Rollback trigger call failed"
            exit 1
          fi

          echo "=== VERIFICATION COMPLETE: COMMIT $EXPECTED_COMMIT IS 100% LIVE ==="

      - name: Post-Deploy Read-Only Smoke Check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}
          BASE_URL: "https://chandakgroup.tech"
          OLD_TARGET: ${{ needs.deploy.outputs.old_target }}
        run: |
          echo "Executing Post-Deploy Read-Only Smoke Check against https://chandakgroup.tech..."
          if ! npx tsx scripts/run-baseline-tests.ts --ci; then
            echo "::error::Post-deploy smoke suite detected regressions! Triggering automatic rollback to $OLD_TARGET..."
            DEPLOY_KEY="${{ secrets.HOSTINGER_DEPLOY_KEY || 'chandak_deploy_secret_2026' }}"
            curl -sS "https://chandakgroup.tech/deploy-hook.php?key=${DEPLOY_KEY}&action=rollback&old=${OLD_TARGET}" || echo "Rollback trigger call failed"
            exit 1
          fi
          echo "Post-deploy read-only smoke check passed cleanly."

      - name: Automated Post-Deploy Server Cleanup (C1)
        if: success()
        run: |
          echo "Triggering post-deploy server housekeeping via deploy-hook..."
          DEPLOY_KEY="${{ secrets.HOSTINGER_DEPLOY_KEY || 'chandak_deploy_secret_2026' }}"
          CLEANUP_RESP=$(curl -sS --connect-timeout 15 --max-time 60 "https://chandakgroup.tech/deploy-hook.php?key=${DEPLOY_KEY}&action=post_deploy_cleanup&sha=${{ github.sha }}" || echo "{}")
          echo "Cleanup response: $CLEANUP_RESP"

          DISK_USED=$(echo "$CLEANUP_RESP" | grep -o '"disk_used_human":"[^"]*"' | cut -d'"' -f4 || echo "Normal")
          FREED_MB=$(echo "$CLEANUP_RESP" | grep -o '"freed_mb":[^,}]*' | cut -d':' -f2 | tr -d ' ' || echo "0")
          FREED_FILES=$(echo "$CLEANUP_RESP" | grep -o '"freed_files":[^,}]*' | cut -d':' -f2 | tr -d ' ' || echo "0")
          REAPED=$(echo "$CLEANUP_RESP" | grep -o '"reaped_workers":[^,}]*' | cut -d':' -f2 | tr -d ' ' || echo "0")

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🧹 Post-Deploy Automatic Cleanup (C1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Disk Used:** $DISK_USED" >> $GITHUB_STEP_SUMMARY
          echo "- **Space Freed:** ${FREED_MB} MB across ${FREED_FILES} pruned files/releases/logs" >> $GITHUB_STEP_SUMMARY
          echo "- **Worker Reaping:** $REAPED orphan node/lsnode processes safely reaped" >> $GITHUB_STEP_SUMMARY

      - name: Write Summary to GitHub Step Summary
        if: always()
        run: |
          echo "### 🚀 Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${{ github.event_name }}\` on \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Live Endpoint** | [https://chandakgroup.tech/api/version](https://chandakgroup.tech/api/version) |" >> $GITHUB_STEP_SUMMARY
