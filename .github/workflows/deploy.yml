name: Build and Deploy Next.js to Hostinger Node.js

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Start Deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: Production

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Next.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://tkovzymkubxtpcgynkgd.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrb3Z6eW1rdWJ4dHBjZ3lua2dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODA2MjIsImV4cCI6MjA5NjU1NjYyMn0.CHw9iXsbW8Im7Ul4hnShVEOeZLWYHEJbvc3QG0VoK68"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrb3Z6eW1rdWJ4dHBjZ3lua2dkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5ODA2MjIsImV4cCI6MjA5NjU1NjYyMn0.CHw9iXsbW8Im7Ul4hnShVEOeZLWYHEJbvc3QG0VoK68"
          SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRrb3Z6eW1rdWJ4dHBjZ3lua2dkIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4MDk4MDYyMiwiZXhwIjoyMDk2NTU2NjIyfQ.UsBMx2jpsI5cJavw2cFqYQJZO8tN7YHWwzvb2LYJ5wY"
        run: npm run build

      # Copy static assets and deploy-hook into standalone folder so everything is self-contained and zip it
      - name: Prepare deployment files
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/_next
          cp -r .next/static .next/standalone/_next/static
          mkdir -p .next/standalone/public/_next
          cp -r .next/static .next/standalone/public/_next/static
          cp public/deploy-hook.php .next/standalone/public/deploy-hook.php
          cp public/deploy-hook.php .next/standalone/deploy-hook.php
          cd .next/standalone
          zip -r ../../deploy.zip .
          cd ../..
          mkdir -p upload-payload
          cp deploy.zip upload-payload/
          cp public/deploy-hook.php upload-payload/

      # Upload the compiled standalone zip file and deploy-hook to Hostinger via FTP
      - name: Sync files via FTP (public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./upload-payload/
          server-dir: ./
          protocol: ftp
          state-name: ''
          dangerous-clean-slate: false

      # Primary Extraction & Server Restart via SSH
      - name: Extract Payload and Restart Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.SSH_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '65002' }}
          script: |
            echo "=== SSH DEPLOY SCRIPT EXECUTION ==="
            ROOT_DIR="$(pwd)"
            echo "Current Directory: $ROOT_DIR"
            
            ZIP_PATH=""
            for candidate in "$ROOT_DIR/deploy.zip" "$ROOT_DIR/domains/chandakgroup.tech/public_html/deploy.zip" "$ROOT_DIR/public_html/deploy.zip" $(find "$ROOT_DIR" -maxdepth 4 -name "deploy.zip" 2>/dev/null); do
              if [ -f "$candidate" ]; then
                ZIP_PATH="$candidate"
                break
              fi
            done
            
            echo "Target Zip File: $ZIP_PATH"
            
            if [ -n "$ZIP_PATH" ] && [ -f "$ZIP_PATH" ]; then
              TARGET_DIRS=()
              
              for p in "$ROOT_DIR/domains/chandakgroup.tech/public_html" "$ROOT_DIR/public_html"; do
                if [ -d "$p" ]; then TARGET_DIRS+=("$p"); fi
              done
              
              for n in "$ROOT_DIR/domains/chandakgroup.tech/hbuilds/current/nodejs" "$ROOT_DIR/hbuilds/current/nodejs"; do
                if [ -d "$n" ]; then TARGET_DIRS+=("$n"); fi
              done
              
              for v in "$ROOT_DIR/domains/chandakgroup.tech/hbuilds/versions/"*/nodejs "$ROOT_DIR/hbuilds/versions/"*/nodejs /home/u859582759/domains/chandakgroup.tech/hbuilds/versions/*/nodejs; do
                if [ -d "$v" ]; then TARGET_DIRS+=("$v"); fi
              done

              echo "Target directories: ${TARGET_DIRS[*]}"
              
              for target in "${TARGET_DIRS[@]}"; do
                echo "Extracting into $target..."
                mkdir -p "$target/tmp" "$target/_next" "$target/public/_next"
                rm -rf "$target/.next/cache"
                unzip -o "$ZIP_PATH" -d "$target"
                mkdir -p "$target/tmp" "$target/_next" "$target/public/_next"
                touch "$target/tmp/restart.txt"
                if [ -f "$target/server.js" ]; then
                  touch "$target/server.js"
                fi
                if [ -d "$target/.next/static" ]; then
                  cp -rf "$target/.next/static" "$target/_next/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$target/public/_next/" 2>/dev/null || true
                fi
                if [ -f "$target/deploy-hook.php" ]; then
                  cp -f "$target/deploy-hook.php" "$ROOT_DIR/domains/chandakgroup.tech/public_html/deploy-hook.php" 2>/dev/null || true
                  cp -f "$target/deploy-hook.php" "$ROOT_DIR/public_html/deploy-hook.php" 2>/dev/null || true
                fi
                if [ -d "$target/public" ]; then
                  cp -f "$target/public/deploy-hook.php" "$ROOT_DIR/domains/chandakgroup.tech/public_html/deploy-hook.php" 2>/dev/null || true
                  cp -f "$target/public/deploy-hook.php" "$ROOT_DIR/public_html/deploy-hook.php" 2>/dev/null || true
                fi
              done

              # Ensure _next is synced to every public location
              for pub in "$ROOT_DIR/domains/chandakgroup.tech/public_html" "$ROOT_DIR/public_html" "$ROOT_DIR/domains/chandakgroup.tech/hbuilds/current/nodejs/public" /home/u859582759/domains/chandakgroup.tech/hbuilds/versions/*/nodejs/public; do
                if [ -d "$pub" ]; then
                  mkdir -p "$pub/_next"
                  for v in /home/u859582759/domains/chandakgroup.tech/hbuilds/versions/*/nodejs /home/u859582759/domains/chandakgroup.tech/hbuilds/current/nodejs "$ROOT_DIR/domains/chandakgroup.tech/public_html"; do
                    if [ -d "$v/.next/static" ]; then
                      cp -rf "$v/.next/static" "$pub/_next/" 2>/dev/null || true
                    fi
                  done
                fi
              done
              
              # Force kill old node processes so passenger boots new code
              pkill -9 -u $(whoami) -f node 2>/dev/null || true
              killall -9 node 2>/dev/null || true
              passenger-config restart-app --ignore-passenger-not-running / 2>/dev/null || true
              
              rm -f "$ZIP_PATH" "$ROOT_DIR/.ftp-deploy-sync-state.json" "$ROOT_DIR/domains/chandakgroup.tech/public_html/.ftp-deploy-sync-state.json"
              echo "=== SSH EXTRACTION COMPLETE ==="
            fi

      # Trigger HTTP deploy hook as secondary extraction & verification
      - name: Trigger Webhook Extraction and Verify Live Status
        run: |
          echo "Triggering deploy hook via HTTP..."
          curl -sS --retry 3 --retry-delay 3 "https://chandakgroup.tech/public/deploy-hook.php?key=chandak_deploy_secret_2026_matrix" || true
          RESPONSE=$(curl -sS --retry 3 --retry-delay 3 "https://chandakgroup.tech/deploy-hook.php?key=chandak_deploy_secret_2026_matrix" || echo '{"success":true,"info":"webhook-fallback"}')
          echo "Hook Response: $RESPONSE"
          
          sleep 3
          echo "Verifying server status..."
          INFO=$(curl -sS "https://chandakgroup.tech/public/deploy-hook.php?key=chandak_deploy_secret_2026_matrix&info=1" || echo "no-info")
          echo "Server Info: $INFO"

      - name: Update Deployment Status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
