name: Build and Deploy Next.js to Hostinger Node.js

concurrency:
  group: production-deploy
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.agents/**'
      - 'tests/**'
      - 'scripts/**'
      - 'ui-audit-report.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment target environment (staging / production)'
        required: false
        default: 'production'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      STAGING_URL: ${{ secrets.STAGING_URL }}
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Start Deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: Production

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run TypeScript Validation (tsc)
        run: npx tsc --noEmit

      - name: Run Staging E2E Smoke Tests
        if: env.STAGING_URL != '' && (github.ref == 'refs/heads/main' || github.base_ref == 'main')
        env:
          E2E_SUPER: ${{ secrets.E2E_SUPER }}
          E2E_MANAGER: ${{ secrets.E2E_MANAGER }}
          E2E_MEMBER: ${{ secrets.E2E_MEMBER }}
          E2E_VIEWER: ${{ secrets.E2E_VIEWER }}
        run: npm run test:e2e

      # Cache Next.js build cache to accelerate compilation across runs
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('app/**/*', 'components/**/*', 'lib/**/*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-
            ${{ runner.os }}-nextjs-

      - name: Build Next.js
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      # Copy static assets and deploy-hook into standalone folder so everything is self-contained and zip it
      - name: Prepare deployment files
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/.next/server
          cp -f .next/server/preview-props.json .next/standalone/.next/server/ 2>/dev/null || true
          if [ ! -f .next/standalone/.next/server/preview-props.json ]; then
            echo '{"previewModeId":"none","previewModeSigningKey":"none","previewModeEncryptionKey":"none"}' > .next/standalone/.next/server/preview-props.json
          fi
          cp public/deploy-hook.php .next/standalone/public/deploy-hook.php

          # Inject production runtime environment variables into standalone package
          cat << EOF > .next/standalone/.env
          NODE_ENV=production
          PORT=3000
          UV_THREADPOOL_SIZE=1
          TOKIO_WORKER_THREADS=1
          DOTENV_CONFIG_QUIET=true
          NODE_OPTIONS=--v8-pool-size=1 --max-old-space-size=512
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN=${{ secrets.CLOUDFLARE_AI_TOKEN }}
          VEHICLE_AI_IMAGE_MODEL=@cf/black-forest-labs/flux-2-klein-9b
          EOF

          # Prepend thread bounds directly to standalone server.js to guarantee 100% enforcement at process entry
          sed -i '1s/^/process.env.UV_THREADPOOL_SIZE = "1"; process.env.TOKIO_WORKER_THREADS = "1"; process.env.DOTENV_CONFIG_QUIET = "true";\n/' .next/standalone/server.js

          cp .next/standalone/.env .next/standalone/.env.production
          cp .next/standalone/.env .next/standalone/.env.local

          cd .next/standalone
          zip -r -q ../../deploy.zip .
          cd ../..
          mkdir -p upload-payload
          cp deploy.zip upload-payload/
          cp public/deploy-hook.php upload-payload/
          cp public/ping.php upload-payload/
          
          # Generate authoritative public_html/.htaccess with PassengerAppRoot
          cat << 'HTACCESS_EOF' > upload-payload/.htaccess
          <IfModule LiteSpeed>
              CacheLookup on
              RewriteEngine On
              RewriteRule .* - [E=verifycaptcha:off]
              RewriteRule .* - [E=noconntimeout:1]
              RewriteRule .* - [E=noabort:1]
          </IfModule>

          <FilesMatch "\.php$">
              PassengerEnabled off
          </FilesMatch>

          <IfModule mod_headers.c>
              <FilesMatch "\.(woff|woff2|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico|css|js)$">
                  Header set Cache-Control "public, max-age=31536000, immutable"
              </FilesMatch>
              <FilesMatch "\.(html|htm|php|json)$">
                  Header set Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
                  Header set CDN-Cache-Control "no-store"
                  Header set Surrogate-Control "no-store"
                  Header set Pragma "no-cache"
                  Header set Expires "0"
              </FilesMatch>
          </IfModule>

          RewriteEngine On
          RewriteRule ^\.builds - [F,L]
          RewriteRule ^deploy\.zip$ - [F,L]

          # CRITICAL: Directly serve all existing static assets from LiteSpeed without waking or spawning Node.js
          RewriteCond %{REQUEST_FILENAME} -f
          RewriteRule ^ - [L]

          PassengerAppRoot /home/u859582759/domains/chandakgroup.tech/hbuilds/current/nodejs
          PassengerRestartDir /home/u859582759/domains/chandakgroup.tech/hbuilds/current/nodejs/tmp
          PassengerEnabled on
          PassengerAppType node
          PassengerNodejs /opt/alt/alt-nodejs20/root/bin/node
          PassengerStartupFile server.js
          PassengerBaseURI /
          PassengerMaxPoolSize 1
          PassengerMaxInstancesPerApp 1
          PassengerMinInstances 0
          PassengerPoolIdleTime 300
          SetEnv NODE_OPTIONS "--v8-pool-size=1 --max-old-space-size=384"
          SetEnv LSNODE_CONSOLE_LOG console.log
          SetEnv TOKIO_WORKER_THREADS 1
          SetEnv UV_THREADPOOL_SIZE 1
          SetEnv DOTENV_CONFIG_QUIET true
          HTACCESS_EOF

      # Upload the compiled standalone zip file, deploy-hook, and htaccess to Hostinger via Direct FTP (Zero Caching)
      - name: Sync files via Direct FTP
        timeout-minutes: 4
        run: |
          echo "Syncing deploy.zip, deploy-hook.php, and .htaccess to Hostinger via Direct FTP..."
          
          # Upload deploy.zip outside public_html to prevent any public HTTP exposure
          curl -sS --connect-timeout 15 --max-time 90 --ftp-create-dirs -T upload-payload/deploy.zip -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/deploy.zip" || echo "FTP to domain deploy.zip failed"
          curl -sS --connect-timeout 15 --max-time 45 --ftp-create-dirs -T upload-payload/deploy-hook.php -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/public_html/deploy-hook.php" || echo "FTP to domain public_html deploy-hook.php failed"
          curl -sS --connect-timeout 15 --max-time 30 --ftp-create-dirs -T upload-payload/ping.php -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/public_html/ping.php" || echo "FTP to domain public_html ping.php failed"
          curl -sS --connect-timeout 15 --max-time 30 --ftp-create-dirs -T upload-payload/.htaccess -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/public_html/.htaccess" || echo "FTP to domain public_html .htaccess failed"

      # Primary Extraction & Server Restart via OpenSSH (with sshpass)
      - name: Extract Payload and Restart Server via SSH
        continue-on-error: true
        run: |
          echo "=== SSH DEPLOY SCRIPT EXECUTION ==="
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
          
          SSH_USER="${{ secrets.SSH_USERNAME || secrets.FTP_USERNAME }}"
          SSH_PASS="${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}"
          SSH_HOST="${{ secrets.FTP_SERVER }}"
          SSH_PORT="${{ secrets.SSH_PORT || '65002' }}"

          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=25 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "bash -s" << 'SSHEOF' || echo "SSH execution encountered an error"
            echo "=== REMOTE SSH EXECUTION STARTED ==="
            ROOT_DIR="$(pwd)"
            echo "Current Directory: $ROOT_DIR"
            
            ZIP_PATH=""
            for cand in "$ROOT_DIR/domains/chandakgroup.tech/deploy.zip" "/home/u859582759/domains/chandakgroup.tech/deploy.zip" "$ROOT_DIR/deploy.zip" "$ROOT_DIR/domains/chandakgroup.tech/public_html/deploy.zip" "$ROOT_DIR/public_html/deploy.zip" "/home/u859582759/deploy.zip" "/home/u859582759/public_html/deploy.zip"; do
              if [ -f "$cand" ]; then
                ZIP_PATH="$cand"
                break
              fi
            done
            if [ -z "$ZIP_PATH" ]; then
              ZIP_PATH=$(find /home/u859582759 "$ROOT_DIR" -maxdepth 5 -name "deploy.zip" 2>/dev/null | head -n 1)
            fi
            
            echo "Target Zip File: $ZIP_PATH"
            
            DOMAIN_ROOT="/home/u859582759/domains/chandakgroup.tech"
            if [ ! -d "$DOMAIN_ROOT" ]; then
              DOMAIN_ROOT="$ROOT_DIR/domains/chandakgroup.tech"
            fi
            
            TARGET_DIRS=()
            CURRENT_NODEJS=$(readlink -f "$DOMAIN_ROOT/hbuilds/current/nodejs" 2>/dev/null)
            if [ -n "$CURRENT_NODEJS" ] && [ -d "$CURRENT_NODEJS" ]; then
              TARGET_DIRS+=("$CURRENT_NODEJS")
            elif [ -d "$DOMAIN_ROOT/hbuilds/current/nodejs" ]; then
              TARGET_DIRS+=("$DOMAIN_ROOT/hbuilds/current/nodejs")
            fi
            NEWEST_VERSION_NODEJS=$(ls -td "$DOMAIN_ROOT/hbuilds/versions"/*/nodejs 2>/dev/null | head -n 1)
            if [ -n "$NEWEST_VERSION_NODEJS" ] && [ -d "$NEWEST_VERSION_NODEJS" ]; then
              NEWEST_REAL=$(readlink -f "$NEWEST_VERSION_NODEJS" 2>/dev/null || echo "$NEWEST_VERSION_NODEJS")
              CURRENT_REAL=$(readlink -f "$CURRENT_NODEJS" 2>/dev/null || echo "$CURRENT_NODEJS")
              if [ "$NEWEST_REAL" != "$CURRENT_REAL" ]; then
                TARGET_DIRS+=("$NEWEST_VERSION_NODEJS")
              fi
            fi

            # Prevent dual-app collision and remove stale prerendered files from public_html
            rm -f "$DOMAIN_ROOT/public_html/server.js" "$DOMAIN_ROOT/public_html/package.json" "$DOMAIN_ROOT/public_html/users.html" "$DOMAIN_ROOT/public_html/users"

            echo "Target directories to update: ${TARGET_DIRS[*]}"
            
            for target in "${TARGET_DIRS[@]}"; do
              if [ -d "$target" ]; then
                echo "Preparing target for in-place atomic extraction: $target"
                # Never delete .next/server prior to extraction - running workers need it to avoid ENOENT crashes
                rm -rf "$target/.next/cache" "$target/_next" "$target/public/_next"
                if [ -n "$ZIP_PATH" ] && [ -f "$ZIP_PATH" ]; then
                  unzip -o -q "$ZIP_PATH" -d "$target" 2>/dev/null || php -r '$z = new ZipArchive(); if ($z->open("'"$ZIP_PATH"'") === TRUE) { $z->extractTo("'"$target"'"); $z->close(); echo "Extracted via PHP ZipArchive to '"$target"'\n"; } else { echo "Failed to extract via PHP\n"; }'
                fi
                mkdir -p "$target/tmp" "$target/_next" "$target/public/_next" "$target/.next/server"
                if [ ! -f "$target/.next/server/preview-props.json" ]; then
                  echo '{"previewModeId":"none","previewModeSigningKey":"none","previewModeEncryptionKey":"none"}' > "$target/.next/server/preview-props.json"
                fi
                touch "$target/tmp/restart.txt"
                if [ -f "$target/server.js" ]; then
                  touch "$target/server.js"
                fi
                if [ -f "$target/package.json" ]; then
                  touch "$target/package.json"
                fi
                # Explicitly delete any .htaccess inside app root to prevent dual-app collisions with public_html
                rm -f "$target/.htaccess" "$target/public/.htaccess" 2>/dev/null || true
                if [ -d "$target/.next/static" ]; then
                  mkdir -p "$DOMAIN_ROOT/public_html/_next" "$DOMAIN_ROOT/public_html/.next" "$target/_next" "$target/public/_next"
                  cp -rf "$target/.next/static" "$DOMAIN_ROOT/public_html/_next/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$DOMAIN_ROOT/public_html/.next/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$target/_next/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$target/public/_next/" 2>/dev/null || true
                  rm -rf "$DOMAIN_ROOT/public_html/.next/server" "$DOMAIN_ROOT/public_html/.next/cache"
                fi
                if [ -f "$target/public/deploy-hook.php" ]; then
                  cp -f "$target/public/deploy-hook.php" "$DOMAIN_ROOT/public_html/deploy-hook.php" 2>/dev/null || true
                fi
              fi
            done

            # Clean up zip file after successful extraction
            rm -f "$ZIP_PATH" "$DOMAIN_ROOT/deploy.zip" "$DOMAIN_ROOT/public_html/deploy.zip" "$ROOT_DIR/deploy.zip"

            # Keep only the 3 newest hbuilds/versions/* folders (never delete the one current points to)
            CURRENT_TARGET_DIR=$(readlink -f "$DOMAIN_ROOT/hbuilds/current" 2>/dev/null)
            CURRENT_VERSION_DIR=$(readlink -f "$DOMAIN_ROOT/hbuilds/current/nodejs" 2>/dev/null)
            ALL_VERSIONS=($(ls -td "$DOMAIN_ROOT/hbuilds/versions"/* 2>/dev/null))
            if [ "${#ALL_VERSIONS[@]}" -gt 3 ]; then
              for old_ver in "${ALL_VERSIONS[@]:3}"; do
                OLD_REAL=$(readlink -f "$old_ver" 2>/dev/null || echo "$old_ver")
                if [ "$OLD_REAL" != "$CURRENT_TARGET_DIR" ] && [ "$OLD_REAL/nodejs" != "$CURRENT_VERSION_DIR" ]; then
                  echo "Pruning old build version: $old_ver"
                  rm -rf "$old_ver" 2>/dev/null || true
                fi
              done
            fi

            # Orphan Process Cleanup: Reap orphan workers before restarting Passenger
            pkill -9 -u $(whoami) -f lsnode 2>/dev/null || true
            pkill -9 -u $(whoami) -f node 2>/dev/null || true
            killall -9 node 2>/dev/null || true

            # Signal passenger restart cleanly via restart triggers
            mkdir -p "$DOMAIN_ROOT/hbuilds/current/nodejs/tmp"
            touch "$DOMAIN_ROOT/hbuilds/current/nodejs/tmp/restart.txt"
            if [ -f "$DOMAIN_ROOT/hbuilds/current/nodejs/server.js" ]; then
              touch "$DOMAIN_ROOT/hbuilds/current/nodejs/server.js"
            fi
            passenger-config restart-app --ignore-passenger-not-running / 2>/dev/null || true
            touch "$DOMAIN_ROOT/public_html/.htaccess" 2>/dev/null || true
            
            rm -f "$ROOT_DIR/.ftp-deploy-sync-state.json" "$DOMAIN_ROOT/public_html/.ftp-deploy-sync-state.json"
            echo "=== SSH EXTRACTION COMPLETE ==="
          SSHEOF

      # Final Live Status Verification & Automated Warmup Gate (Single Unified Loop)
      - name: Verify Live Deployment Status & Warmup Gate
        timeout-minutes: 4
        run: |
          echo "Initiating automated warmup gate: polling /api/version every 5s (max 3 min)..."
          WARM_SUCCESS=false
          LAST_RESPONSE=""
          LAST_HTTP="000"

          for attempt in $(seq 1 36); do
            LAST_HTTP=$(curl -s -L -o /tmp/version_resp.json -w "%{http_code}" --connect-timeout 5 --max-time 15 "https://chandakgroup.tech/api/version" || echo "000")
            if [ -f /tmp/version_resp.json ]; then
              LAST_RESPONSE=$(cat /tmp/version_resp.json 2>/dev/null || echo "")
            fi

            echo "Attempt $attempt/36: HTTP $LAST_HTTP"

            if [ "$LAST_HTTP" = "200" ] && echo "$LAST_RESPONSE" | grep -q '"status":"online"'; then
              echo "SUCCESS: Passenger Node.js worker is warm, online, and responding with HTTP 200!"
              echo "$LAST_RESPONSE"
              WARM_SUCCESS=true
              break
            fi

            sleep 5
          done

          if [ "$WARM_SUCCESS" != "true" ]; then
            echo "::error::Warmup gate failed after 3 minutes! Last HTTP: $LAST_HTTP, Last response: $LAST_RESPONSE"
            exit 1
          fi

          echo "=== WARMUP GATE PASSED (/api/version is warm and online) ==="

      - name: Update Deployment Status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
