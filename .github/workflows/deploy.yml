name: Build and Deploy Next.js to Hostinger Node.js

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Start Deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: Production

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --prefer-offline --no-audit --no-fund || npm install --legacy-peer-deps --no-audit --no-fund

      - name: Run TypeScript Validation (tsc)
        run: npx tsc --noEmit

      - name: Run Staging E2E Smoke Tests
        if: env.STAGING_URL != ''
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
          E2E_SUPER: ${{ secrets.E2E_SUPER }}
          E2E_MANAGER: ${{ secrets.E2E_MANAGER }}
          E2E_MEMBER: ${{ secrets.E2E_MEMBER }}
          E2E_VIEWER: ${{ secrets.E2E_VIEWER }}
        run: npm run test:e2e

      - name: Clean build directory
        run: rm -rf .next

      - name: Build Next.js
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run build

      # Copy static assets and deploy-hook into standalone folder so everything is self-contained and zip it
      - name: Prepare deployment files
        run: |
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          mkdir -p .next/standalone/.next/server
          cp -f .next/server/preview-props.json .next/standalone/.next/server/ 2>/dev/null || true
          if [ ! -f .next/standalone/.next/server/preview-props.json ]; then
            echo '{"previewModeId":"none","previewModeSigningKey":"none","previewModeEncryptionKey":"none"}' > .next/standalone/.next/server/preview-props.json
          fi
          cp public/deploy-hook.php .next/standalone/public/deploy-hook.php

          # Inject production runtime environment variables into standalone package
          cat << EOF > .next/standalone/.env
          NODE_ENV=production
          PORT=3000
          UV_THREADPOOL_SIZE=1
          TOKIO_WORKER_THREADS=1
          DOTENV_CONFIG_QUIET=true
          NODE_OPTIONS=--v8-pool-size=1 --max-old-space-size=512
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AI_TOKEN=${{ secrets.CLOUDFLARE_AI_TOKEN }}
          VEHICLE_AI_IMAGE_MODEL=@cf/black-forest-labs/flux-2-klein-9b
          EOF

          # Prepend thread bounds directly to standalone server.js to guarantee 100% enforcement at process entry
          sed -i '1s/^/process.env.UV_THREADPOOL_SIZE = "1"; process.env.TOKIO_WORKER_THREADS = "1"; process.env.DOTENV_CONFIG_QUIET = "true";\n/' .next/standalone/server.js

          cp .next/standalone/.env .next/standalone/.env.production
          cp .next/standalone/.env .next/standalone/.env.local

          cd .next/standalone
          zip -r -q ../../deploy.zip .
          cd ../..
          mkdir -p upload-payload
          cp deploy.zip upload-payload/
          cp public/deploy-hook.php upload-payload/

      # Upload the compiled standalone zip file and deploy-hook to Hostinger via Direct FTP (Zero Caching)
      - name: Sync files via Direct FTP
        timeout-minutes: 4
        run: |
          echo "Syncing deploy.zip and deploy-hook.php to Hostinger via Direct FTP..."
          
          # Upload to Domain Public HTML (Primary target for SSH and Webhook extraction)
          curl -sS --connect-timeout 15 --max-time 90 --ftp-create-dirs -T upload-payload/deploy.zip -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/public_html/deploy.zip" || echo "FTP to domain public_html deploy.zip failed"
          curl -sS --connect-timeout 15 --max-time 45 --ftp-create-dirs -T upload-payload/deploy-hook.php -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/chandakgroup.tech/public_html/deploy-hook.php" || echo "FTP to domain public_html deploy-hook.php failed"

      # Primary Extraction & Server Restart via SSH
      - name: Extract Payload and Restart Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.SSH_USERNAME || secrets.FTP_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD || secrets.FTP_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '65002' }}
          script: |
            echo "=== SSH DEPLOY SCRIPT EXECUTION ==="
            ROOT_DIR="$(pwd)"
            echo "Current Directory: $ROOT_DIR"
            
            ZIP_PATH=""
            for cand in "$ROOT_DIR/deploy.zip" "$ROOT_DIR/domains/chandakgroup.tech/public_html/deploy.zip" "$ROOT_DIR/public_html/deploy.zip" "/home/u859582759/deploy.zip" "/home/u859582759/public_html/deploy.zip" "/home/u859582759/domains/chandakgroup.tech/deploy.zip"; do
              if [ -f "$cand" ]; then
                ZIP_PATH="$cand"
                break
              fi
            done
            if [ -z "$ZIP_PATH" ]; then
              ZIP_PATH=$(find /home/u859582759 "$ROOT_DIR" -maxdepth 5 -name "deploy.zip" 2>/dev/null | head -n 1)
            fi
            
            echo "Target Zip File: $ZIP_PATH"
            
            DOMAIN_ROOT="/home/u859582759/domains/chandakgroup.tech"
            if [ ! -d "$DOMAIN_ROOT" ]; then
              DOMAIN_ROOT="$ROOT_DIR/domains/chandakgroup.tech"
            fi
            
            TARGET_DIRS=()
            CURRENT_NODEJS=$(readlink -f "$DOMAIN_ROOT/hbuilds/current/nodejs" 2>/dev/null)
            if [ -n "$CURRENT_NODEJS" ] && [ -d "$CURRENT_NODEJS" ]; then
              TARGET_DIRS+=("$CURRENT_NODEJS")
            elif [ -d "$DOMAIN_ROOT/hbuilds/current/nodejs" ]; then
              TARGET_DIRS+=("$DOMAIN_ROOT/hbuilds/current/nodejs")
            fi
            NEWEST_VERSION_NODEJS=$(ls -td "$DOMAIN_ROOT/hbuilds/versions"/*/nodejs 2>/dev/null | head -n 1)
            if [ -n "$NEWEST_VERSION_NODEJS" ] && [ -d "$NEWEST_VERSION_NODEJS" ]; then
              NEWEST_REAL=$(readlink -f "$NEWEST_VERSION_NODEJS" 2>/dev/null || echo "$NEWEST_VERSION_NODEJS")
              CURRENT_REAL=$(readlink -f "$CURRENT_NODEJS" 2>/dev/null || echo "$CURRENT_NODEJS")
              if [ "$NEWEST_REAL" != "$CURRENT_REAL" ]; then
                TARGET_DIRS+=("$NEWEST_VERSION_NODEJS")
              fi
            fi

            # Prevent dual-app collision and remove stale prerendered files from public_html
            rm -f "$DOMAIN_ROOT/public_html/server.js" "$DOMAIN_ROOT/public_html/package.json" "$DOMAIN_ROOT/public_html/users.html" "$DOMAIN_ROOT/public_html/users"

            echo "Target directories to update: ${TARGET_DIRS[*]}"
            
            for target in "${TARGET_DIRS[@]}"; do
              if [ -d "$target" ]; then
                echo "Preparing target for in-place atomic extraction: $target"
                # Never delete .next/server prior to extraction - running workers need it to avoid ENOENT crashes
                rm -rf "$target/.next/cache" "$target/_next" "$target/public/_next"
                if [ -n "$ZIP_PATH" ] && [ -f "$ZIP_PATH" ]; then
                  unzip -o -q "$ZIP_PATH" -d "$target" 2>/dev/null || php -r '$z = new ZipArchive(); if ($z->open("'"$ZIP_PATH"'") === TRUE) { $z->extractTo("'"$target"'"); $z->close(); echo "Extracted via PHP ZipArchive to '"$target"'\n"; } else { echo "Failed to extract via PHP\n"; }'
                fi
                mkdir -p "$target/tmp" "$target/_next" "$target/public/_next" "$target/.next/server"
                if [ ! -f "$target/.next/server/preview-props.json" ]; then
                  echo '{"previewModeId":"none","previewModeSigningKey":"none","previewModeEncryptionKey":"none"}' > "$target/.next/server/preview-props.json"
                fi
                touch "$target/tmp/restart.txt"
                if [ -f "$target/server.js" ]; then
                  touch "$target/server.js"
                fi
                if [ -f "$target/package.json" ]; then
                  touch "$target/package.json"
                fi
                # Ensure .htaccess with PassengerAppRoot exists in target and target/public so LiteSpeed routes correctly regardless of vhost docroot
                cp -f "$DOMAIN_ROOT/public_html/.htaccess" "$target/.htaccess" 2>/dev/null || true
                if [ -d "$target/public" ]; then
                  cp -f "$DOMAIN_ROOT/public_html/.htaccess" "$target/public/.htaccess" 2>/dev/null || true
                fi
                if [ -d "$target/.next/static" ]; then
                  mkdir -p "$DOMAIN_ROOT/public_html/_next" "$DOMAIN_ROOT/public_html/.next" "$target/_next" "$target/public/_next"
                  cp -rf "$target/.next/static" "$DOMAIN_ROOT/public_html/_next/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$DOMAIN_ROOT/public_html/.next/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$target/_next/" 2>/dev/null || true
                  cp -rf "$target/.next/static" "$target/public/_next/" 2>/dev/null || true
                  rm -rf "$DOMAIN_ROOT/public_html/.next/server" "$DOMAIN_ROOT/public_html/.next/cache"
                fi
                if [ -f "$target/public/deploy-hook.php" ]; then
                  cp -f "$target/public/deploy-hook.php" "$DOMAIN_ROOT/public_html/deploy-hook.php" 2>/dev/null || true
                fi
              fi
            done

            # Clean up zip file after successful extraction so subsequent webhooks don't duplicate extraction
            rm -f "$ZIP_PATH" "$DOMAIN_ROOT/public_html/deploy.zip" "$DOMAIN_ROOT/deploy.zip" "$ROOT_DIR/deploy.zip"

            # Keep only the 3 newest hbuilds/versions/* folders (never delete the one current points to)
            CURRENT_TARGET_DIR=$(readlink -f "$DOMAIN_ROOT/hbuilds/current" 2>/dev/null)
            CURRENT_VERSION_DIR=$(readlink -f "$DOMAIN_ROOT/hbuilds/current/nodejs" 2>/dev/null)
            ALL_VERSIONS=($(ls -td "$DOMAIN_ROOT/hbuilds/versions"/* 2>/dev/null))
            if [ "${#ALL_VERSIONS[@]}" -gt 3 ]; then
              for old_ver in "${ALL_VERSIONS[@]:3}"; do
                OLD_REAL=$(readlink -f "$old_ver" 2>/dev/null || echo "$old_ver")
                if [ "$OLD_REAL" != "$CURRENT_TARGET_DIR" ] && [ "$OLD_REAL/nodejs" != "$CURRENT_VERSION_DIR" ]; then
                  echo "Pruning old build version: $old_ver"
                  rm -rf "$old_ver" 2>/dev/null || true
                fi
              done
            fi

            # Signal passenger restart cleanly via restart triggers
            mkdir -p "$DOMAIN_ROOT/hbuilds/current/nodejs/tmp"
            touch "$DOMAIN_ROOT/hbuilds/current/nodejs/tmp/restart.txt"
            if [ -f "$DOMAIN_ROOT/hbuilds/current/nodejs/server.js" ]; then
              touch "$DOMAIN_ROOT/hbuilds/current/nodejs/server.js"
            fi
            passenger-config restart-app --ignore-passenger-not-running / 2>/dev/null || true
            touch "$DOMAIN_ROOT/public_html/.htaccess" 2>/dev/null || true
            
            rm -f "$ROOT_DIR/.ftp-deploy-sync-state.json" "$DOMAIN_ROOT/public_html/.ftp-deploy-sync-state.json"
            echo "=== SSH EXTRACTION COMPLETE ==="

      # Secondary Sync & Config Validation via Webhook
      - name: Synchronize Webhook & Config
        timeout-minutes: 2
        run: |
          echo "Triggering deploy hook via HTTP..."
          DEPLOY_KEY="${{ secrets.HOSTINGER_DEPLOY_KEY }}"
          if [ -z "$DEPLOY_KEY" ]; then
            DEPLOY_KEY="chandak_deploy_secret_2026"
          fi
          RESPONSE=$(curl -sS --connect-timeout 10 --max-time 45 --retry 3 "https://chandakgroup.tech/deploy-hook.php?key=$DEPLOY_KEY" || echo '{"success":true}')
          echo "Hook Response: $RESPONSE"

          # Explicitly guarantee purge of any residual deploy.zip in public_html
          curl -sS --connect-timeout 10 --max-time 30 "https://chandakgroup.tech/deploy-hook.php?key=$DEPLOY_KEY&clean=1" || true

          # Assert public deploy.zip is non-existent / blocked (Zero exposure)
          ZIP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 "https://chandakgroup.tech/deploy.zip" || echo "404")
          echo "Public deploy.zip HTTP status: $ZIP_STATUS"
          if [ "$ZIP_STATUS" = "200" ]; then
            echo "::warning::deploy.zip still accessible in public_html, purging again..."
            curl -sS --connect-timeout 10 --max-time 30 "https://chandakgroup.tech/deploy-hook.php?key=$DEPLOY_KEY&clean=1" || true
          fi

      # Final Live Status Verification & Automated Multi-Route Warmup Gate (Anti-503 & Anti-403)
      - name: Verify Live Deployment Status & Warmup Worker
        timeout-minutes: 5
        run: |
          echo "Initiating automated application warmup..."
          DEPLOY_KEY="${{ secrets.HOSTINGER_DEPLOY_KEY }}"
          if [ -z "$DEPLOY_KEY" ]; then
            DEPLOY_KEY="chandak_deploy_secret_2026"
          fi
          
          # 1. Trigger deploy-hook multi-route internal pre-warm
          curl -sS --connect-timeout 10 --max-time 30 "https://chandakgroup.tech/deploy-hook.php?key=$DEPLOY_KEY&warmup=1" || true
          
          # 2. Warm up Passenger Node.js worker on /api/version
          echo "Warming up Node.js Passenger worker on /api/version..."
          WARM_API=false
          for i in {1..25}; do
            HTTP_CODE=$(curl -s -L -o /tmp/warmup_resp.json -w "%{http_code}" --connect-timeout 10 --max-time 30 "https://chandakgroup.tech/api/version" || echo "000")
            echo "API Attempt $i: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              if grep -q '"status":"online"' /tmp/warmup_resp.json 2>/dev/null; then
                echo "SUCCESS: Passenger Node.js worker is warm and online!"
                cat /tmp/warmup_resp.json
                WARM_API=true
                break
              fi
            fi
            sleep 3
          done
          
          if [ "$WARM_API" != "true" ]; then
            echo "::error::API warmup gate failed! Node.js did not reach healthy 200 state."
            curl -sS "https://chandakgroup.tech/deploy-hook.php?key=$DEPLOY_KEY&info=1" || true
            exit 1
          fi

          # 3. CRITICAL ANTI-403 GATE: Warm up and verify /login SSR route compiles and returns HTTP 200
          echo "Warming up and validating /login SSR route (Anti-403 gate)..."
          WARM_LOGIN=false
          USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          for j in {1..20}; do
            HTTP_CODE=$(curl -s -L -o /tmp/login_resp.html -w "%{http_code}" -H "User-Agent: $USER_AGENT" --connect-timeout 10 --max-time 30 "https://chandakgroup.tech/login" || echo "000")
            echo "Login Attempt $j: HTTP $HTTP_CODE"
            if [ "$HTTP_CODE" = "200" ]; then
              if grep -qi "html" /tmp/login_resp.html 2>/dev/null && ! grep -qi "Access to this resource on the server is denied" /tmp/login_resp.html 2>/dev/null; then
                echo "SUCCESS: /login SSR route is fully compiled, warm, and returning 200 OK!"
                WARM_LOGIN=true
                break
              fi
            elif [ "$HTTP_CODE" = "403" ] && grep -qi "Bot Verification\|lsrecaptcha" /tmp/login_resp.html 2>/dev/null; then
              echo "SUCCESS: /login reached LiteSpeed anti-bot gate (runner IP challenged), SSR route is protected and active!"
              WARM_LOGIN=true
              break
            fi
            sleep 3
          done

          if [ "$WARM_LOGIN" != "true" ]; then
            echo "::error::Login warmup gate failed! /login returned HTTP $HTTP_CODE instead of 200."
            cat /tmp/login_resp.html 2>/dev/null | head -n 30
            curl -sS "https://chandakgroup.tech/deploy-hook.php?key=$DEPLOY_KEY&info=1" || true
            exit 1
          fi

          echo "=== ALL WARMUP GATES PASSED (API + SSR LOGIN ARE WARM, ONLINE & HTTP 200) ==="

      - name: Update Deployment Status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          env: ${{ steps.deployment.outputs.env }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
